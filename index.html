<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tone-chan Adventures</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #171923;
      color: #f5f5f5;
    }

    body {
      box-sizing: border-box;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
      align-items: start;
      justify-items: center;
    }

    main {
      width: min(100%, 720px);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.5rem, 5vw, 2rem);
    }

    #game {
      width: 100%;
      overflow: visible;
      background: transparent;
    }

    /* Block layout, not flex. iOS Safari drops the height of a flex
       item whose only child is an absolute canvas, so the toolbar
       has nowhere to sit and ends up clipped over the picture. */
    #game.ejs_parent,
    #game .ejs_parent {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      overflow: visible !important;
      background: transparent !important;
    }

    /* padding-top is the height. aspect-ratio alone collapses on iOS
       when the canvas is taken out of flow. */
    #game .ejs_game::before,
    #game .ejs_canvas_parent::before {
      content: "";
      display: block;
      width: 100%;
      padding-top: 75%;
    }

    #game .ejs_game,
    #game .ejs_canvas_parent {
      position: relative !important;
      width: 100% !important;
      height: auto !important;
      overflow: hidden !important;
      border: 1px solid #44485a;
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      background: #08090d;
    }

    #game canvas,
    #game .ejs_canvas {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    /* Touch controls sit in the old menu slot, under the picture.
       Their pieces are positioned from the bottom of this box, so the
       box needs a real height or iOS collapses it. */
    #game .ejs_virtualGamepad_parent {
      position: relative !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      pointer-events: auto !important;
      width: 100% !important;
      height: 196px !important;
      max-height: none !important;
      margin: 0 !important;
      top: auto !important;
      right: auto !important;
      bottom: auto !important;
      left: auto !important;
      -webkit-transform: none !important;
      transform: none !important;
      z-index: 3;
      overflow: hidden;
      box-sizing: border-box !important;
      background: #12141c !important;
      border-left: 1px solid #44485a;
      border-right: 1px solid #44485a;
    }

    /* The corner control that used to open this pad over the picture. */
    #game .ejs_virtualGamepad_open {
      display: none !important;
    }

    /* The start button is a sibling of the picture, so pull it
       back inside the frame. The toolbar stays underneath. */
    #game .ejs_start_button {
      position: absolute !important;
      left: 50% !important;
      right: auto !important;
      top: auto !important;
      bottom: 24px !important;
      transform: translateX(-50%) !important;
      z-index: 5;
    }

    #game .ejs_menu_bar,
    #game .ejs_big_screen .ejs_menu_bar,
    #game .ejs_small_screen .ejs_menu_bar,
    #game .ejs_menu_bar_hidden,
    #game .ejs_big_screen .ejs_menu_bar_hidden,
    #game .ejs_small_screen .ejs_menu_bar_hidden {
      position: relative !important;
      left: 0 !important;
      right: auto !important;
      top: auto !important;
      bottom: auto !important;
      -webkit-transform: none !important;
      transform: none !important;
      z-index: 2;
      opacity: 1 !important;
      pointer-events: auto !important;
      visibility: visible !important;
      width: 100% !important;
      max-height: none !important;
      margin: 0 !important;
      box-sizing: border-box !important;
      display: flex !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 2px;
      padding: 8px 10px !important;
      background: #12141c !important;
      border: 1px solid #44485a;
      border-top: 0;
      border-radius: 0 0 12px 12px;
    }

    p {
      color: #c7c9d3;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Tone-chan Adventures</h1>
    <div id="game" aria-label="Game Boy Color emulator"></div>
    <p>Game Boy Color browser embed. Click the game to play; keyboard and touch controls are available in the emulator menu.</p>
  </main>

  <script>
    EJS_player = "#game";
    EJS_core = "gb";
    EJS_gameName = "Tone-chan Adventures";
    // New address each visit, so a bad saved copy of the ROM is not reused.
    EJS_gameUrl = new URL("Tone-chan Adventures v.3.5.0.gbc", window.location.href).href + "?fresh=" + Date.now();
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    // Reboot the cart once, a second after the core starts.
    EJS_softLoad = 1;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
  <script>
    // Put the on-screen controls under the picture, and the
    // restart/volume menu under those controls. The start button
    // stays inside the picture.
    (function () {
      const root = document.querySelector("#game");
      const layout = () => {
        const frame = root.querySelector(".ejs_game");
        const button = root.querySelector(".ejs_start_button");
        if (frame && button && button.parentElement !== frame) frame.appendChild(button);

        const picture = root.querySelector(".ejs_canvas_parent") || frame;
        const pad = root.querySelector(".ejs_virtualGamepad_parent");
        const bar = root.querySelector(".ejs_menu_bar");
        if (!pad || !picture) return;
        if (pad.hidden) pad.hidden = false;
        if (pad.previousElementSibling === picture) return;
        if (bar && bar.parentElement === root) root.insertBefore(pad, bar);
        else picture.insertAdjacentElement("afterend", pad);
      };
      const observer = new MutationObserver(() => {
        observer.disconnect();
        try { layout(); } finally {
          observer.observe(root, { childList: true, subtree: true });
        }
      });
      observer.observe(root, { childList: true, subtree: true });
      layout();
    })();
  </script>
</body>
</html>
